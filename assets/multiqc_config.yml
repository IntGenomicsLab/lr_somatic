report_comment: >
  This report has been generated by the <a href="https://github.com/IntGenomicsLab/lrsomatic/tree/dev" target="_blank">IntGenomicsLab/lrsomatic</a> analysis pipeline.
report_section_order:
  "IntGenomicsLab-lrsomatic-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "IntGenomicsLab-lrsomatic-summary":
    order: -1002

export_plots: true

# Post-alignment NanoPlot files are named <sample>_<type>_aln_NanoStats.txt. Dropping "_aln"
# puts their NanoStat row on the same <sample>_<type> row as samtools and mosdepth for that BAM.
extra_fn_clean_exts:
  - "_aln"

disable_version_detection: true
